<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>Reels</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html,
body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
}

.reels-container {
  width: 100%;
  height: 100vh;

  overflow-y: auto;
  overflow-x: hidden;

  scroll-snap-type: y mandatory;
  scroll-behavior: smooth;

  scrollbar-width: none;
}

.reels-container::-webkit-scrollbar {
  display: none;
}

.reel {
  width: 100%;
  height: 100vh;

  position: relative;

  scroll-snap-align: start;
  scroll-snap-stop: always;

  display: flex;
  align-items: center;
  justify-content: center;

  background: #000;

  overflow: hidden;
}

.reel video {
  width: 100%;
  height: 100%;

  display: block;

  object-fit: contain;

  background: #000;
}
</style>
</head>

<body>

<div class="reels-container">

  <!-- Video 1 -->
  <div class="reel">
    <video
      src="https://litter.catbox.moe/xdylol.mp4"
      playsinline
      preload="metadata"
      controls>
    </video>
  </div>

  <!-- Video 2 -->
  <div class="reel">
    <video
      src="https://litter.catbox.moe/3zm6qh.mp4"
      playsinline
      preload="metadata"
      controls>
    </video>
  </div>

  <!-- Video 3 -->
  <div class="reel">
    <video
      src="https://litter.catbox.moe/3ndf43.mp4"
      playsinline
      preload="metadata"
      controls>
    </video>
  </div>

  <!-- Video 4 -->
  <div class="reel">
    <video
      src="https://litter.catbox.moe/vntjgg.mp4"
      playsinline
      preload="metadata"
      controls>
    </video>
  </div>

  <!-- Video 5 -->
  <div class="reel">
    <video
      src="https://litter.catbox.moe/dj3tyx.mp4"
      playsinline
      preload="metadata"
      controls>
    </video>
  </div>

  <!-- Video 6 -->
  <div class="reel">
    <video
      src="https://litter.catbox.moe/r0tky1.mp4"
      playsinline
      preload="metadata"
      controls>
    </video>
  </div>

</div>


<script>

const videos = document.querySelectorAll(".reel video");


/*
  Ek time par sirf ek video chalegi.
*/
function playOnly(video) {

  videos.forEach(v => {

    if (v !== video) {
      v.pause();
    }

  });

  video.play().catch(() => {});
}


/*
  Jo video screen par clearly visible hai,
  wahi automatically play hogi.
*/
const observer = new IntersectionObserver(

  (entries) => {

    entries.forEach(entry => {

      if (
        entry.isIntersecting &&
        entry.intersectionRatio >= 0.7
      ) {

        playOnly(entry.target);

      } else {

        entry.target.pause();

      }

    });

  },

  {
    threshold: [0.7]
  }

);


/*
  Saari videos observe karo.
*/
videos.forEach(video => {

  observer.observe(video);

});


/*
  Page load par first video ready.
*/
window.addEventListener("load", () => {

  if (videos.length > 0) {
    playOnly(videos[0]);
  }

});

</script>

</body>
</html>
